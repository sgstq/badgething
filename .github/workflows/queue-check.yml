name: Queue Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  queue-check:
    name: Queue check
    runs-on: ubuntu-latest
    steps:
      - name: Confirm workflow queued
        run: |
          echo "Workflow queued successfully."
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
